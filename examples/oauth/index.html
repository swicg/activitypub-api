<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ActivityPub API OAuth demo</title>
  </head>
  <body>
    <h1>ActivityPub API OAuth demo</h1>
    <p>
      <input type="webfinger"
            placeholder="user@domain.example"
            id="webfinger"
            name="webfinger">
      </input>
      <button id="login">Login</button>
      <button id="logout" disabled="disabled">Logout</button>
      <button id="refresh" disabled="disabled">Refresh</button>
    </p>
    <p>
      <span id="status"></span>
    </p>
    <script type="module">
      import * as oauth from 'https://cdn.jsdelivr.net/npm/oauth4webapi@3/+esm';

      const redirectUri = window.location.origin + window.location.pathname;
      const cimd_id = (new URL('cimd.json', window.location.href)).toString();
      const d8c2_id = (new URL('d8c2.jsonld', window.location.href)).toString();

      const allowInsecureRequests = false; // useful for testing locally

      function setStatus(text) {
        const el = document.getElementById("status");
        if (el) {
          el.textContent = text;
        }
      }

      async function getActorIdFromWebfinger(webfinger) {
        const [username, domain] = webfinger.split('@')
        const url = `https://${domain}/.well-known/webfinger?resource=acct:${webfinger}`
        const res = await fetch(url, {
          headers: {Accept: 'application/xrd+json, application/json'}
        })
        if (!res.ok) {
          throw new Error(`Could not load webfinger info for ${webfinger}`)
        }
        const json = await res.json()
        if (!Array.isArray(json.links)) {
          throw new Error(`Could not load webfinger info for ${webfinger}`)
        }
        const TYPES = [
          'application/activity+json',
          'application/ld+json; profile="https://www.w3.org/ns/activitystreams"'
        ]
        const actorLink = json.links.find(link =>
          link.rel == 'self' && TYPES.includes(link.type)
        )
        if (!actorLink) {
          throw new Error(`Could not find actor link for ${webfinger}`)
        }
        return actorLink.href
      }

      async function getAsFromOrigin(asOrigin) {
        const res = await oauth.discoveryRequest(new URL(asOrigin), {
          algorithm: "oauth2",
          [oauth.allowInsecureRequests]: allowInsecureRequests,
        });
        if (!res.ok) {
         return null;
        }
        const as = await oauth.processDiscoveryResponse(
          new URL(asOrigin),
          res,
        );
        return as;
      }

      async function getAsFromActor(actorId) {
        const res = await fetch(actorId,
          {
            'Accept': 'application/activity+json;q=1.0, application/ld+json;q=0.8, application/json;q=0.5'
          }
        )
        if (!res.ok) {
          return null;
        }
        const actor = await res.json()
        const as = {}
        as.authorization_endpoint = actor.endpoints?.oauthAuthorizationEndpoint
        as.token_endpoint = actor.endpoints?.oauthTokenEndpoint
        if (actor.objectIDAsClientID) {
          as.activitypub_object_id_as_client_id = true
        }
        as.registration_endpoint = actor.endpoints?.oauthRegistrationEndpoint
        return as
      }

      async function discoverAs(origin, actorId) {
        let as = await getAsFromOrigin(origin);

        if (!as) {
          as = await getAsFromActor(actorId);
        }

        if (!as) {
          throw new Error(`Cannot load AuthorizationServer for ${origin}`)
        }

        return as
      }


      async function getDynamicClientId(as) {

        const metadata = {
          "client_name": "Example OAuth Client for ActivityPub API",
          "redirect_uris": [
            redirectUri
          ],
          "token_endpoint_auth_method": "none",
          "grant_types": ["authorization_code", "refresh_token"],
          "response_types": ["code"],
          "software_id": "1027348F-E698-45C4-8900-F1144E57807C",
          "software_version": "0.1.0"
        }

        const res = await oauth.dynamicClientRegistrationRequest(
          as,
          metadata,
          { [oauth.allowInsecureRequests]: allowInsecureRequests }
        )

        if (!res.ok) {
         return null;
        }

        const client = await oauth.processDynamicClientRegistrationResponse(res)

        return client.client_id
      }

      async function discoverClient(as, origin) {
          let client_id
          if (as.client_id_metadata_document_supported) {
            client_id = cimd_id;
          } else if (as.activitypub_object_id_as_client_id) {
            client_id = d8c2_id;
          } else if (as.registration_endpoint) {
            client_id = await getDynamicClientId(as);
          } else {
            throw new Error('No way to get a client_id for this account')
          }
          const client = { client_id }
          return client
      }

      async function startLogin(as, client) {
        setStatus("Logging in...");
        const code_verifier = oauth.generateRandomCodeVerifier();
        const code_challenge =
          await oauth.calculatePKCECodeChallenge(code_verifier);
        const state = oauth.generateRandomState();

        sessionStorage.setItem("code_verifier", code_verifier);
        sessionStorage.setItem("state", state);

        const scope = "read write";

        const authz = new URL(as.authorization_endpoint);
        authz.searchParams.set("client_id", client.client_id);
        authz.searchParams.set("redirect_uri", redirectUri);
        authz.searchParams.set("response_type", "code");
        authz.searchParams.set("scope", scope);
        authz.searchParams.set("code_challenge", code_challenge);
        authz.searchParams.set("code_challenge_method", "S256");
        authz.searchParams.set("state", state);

        window.location.href = authz.toString();
      }

      async function finishLogin(as, client) {
        try {
          const state = sessionStorage.getItem("state");
          const code_verifier = sessionStorage.getItem("code_verifier");

          const params = oauth.validateAuthResponse(
            as,
            client,
            new URL(window.location.href),
            state,
          );

          const response = await oauth.authorizationCodeGrantRequest(
            as,
            client,
            oauth.None(),
            params,
            redirectUri,
            code_verifier,
            { [oauth.allowInsecureRequests]: allowInsecureRequests },
          );

          if (!response.ok) {
            throw new Error(
              `Bad status from token endpoint: ${response.status}`,
            );
          }

          const result = await oauth.processAuthorizationCodeResponse(
            as,
            client,
            response,
          );

          const { access_token, refresh_token } = result;

          sessionStorage.setItem("access_token", access_token);
          sessionStorage.setItem("refresh_token", refresh_token);

          sessionStorage.removeItem("state");
          sessionStorage.removeItem("code_verifier");

          window.location.href = redirectUri;
        } catch (error) {
          setStatus(error.message);
          sessionStorage.removeItem("state");
          sessionStorage.removeItem("code_verifier");
        }
      }

      async function refreshAccessToken(as, client) {
        try {
          const refreshToken = sessionStorage.getItem("refresh_token");

          const response = await oauth.refreshTokenGrantRequest(
            as,
            client,
            oauth.None(),
            refreshToken,
            { [oauth.allowInsecureRequests]: allowInsecureRequests },
          );

          if (!response.ok) {
            throw new Error(
              `Bad status from token endpoint: ${response.status}`,
            );
          }

          const result = await oauth.processRefreshTokenResponse(
            as,
            client,
            response,
          );

          const { access_token } = result;

          sessionStorage.setItem("access_token", access_token);

          setStatus("Token refreshed.");

          window.location.href = redirectUri;
        } catch (error) {
          setStatus(error.message);
        }
      }

      async function showUsername(as) {
        const access_token = sessionStorage.getItem("access_token");
        try {
          setStatus("Logged in");
        } catch (error) {
          setStatus(error.message);
        }
      }

      function getStoredOrigin() {
          return sessionStorage.getItem('as_origin')
      }

      function getStoredAs(origin) {
          const json = localStorage.getItem(`as:${origin}`)
          return JSON.parse(json)
      }

      function getStoredClient(origin) {
          const json = localStorage.getItem(`client:${origin}`)
          return JSON.parse(json)
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const loginEl = document.getElementById("login");
        const logoutEl = document.getElementById("logout");
        const refreshEl = document.getElementById("refresh");
        const webfingerEl = document.getElementById("webfinger");

        const params = new URLSearchParams(window.location.search);

        if (sessionStorage.getItem("access_token")) {
          loginEl?.setAttribute("disabled", "disabled");
          webfingerEl?.setAttribute("disabled", "disabled");
          logoutEl?.removeAttribute("disabled");
          refreshEl?.removeAttribute("disabled");
          const as = getStoredAs(getStoredOrigin());
          await showUsername(as);
        } else if (params.get("state")) {
          loginEl?.setAttribute("disabled", "disabled");
          webfingerEl?.setAttribute("disabled", "disabled");
          logoutEl?.setAttribute("disabled", "disabled");
          refreshEl?.setAttribute("disabled", "disabled");
          const as = getStoredAs(getStoredOrigin());
          const client = getStoredClient(getStoredOrigin());
          await finishLogin(as, client);
        } else {
          loginEl?.removeAttribute("disabled");
          webfingerEl?.removeAttribute("disabled");
          logoutEl?.setAttribute("disabled", "disabled");
          refreshEl?.setAttribute("disabled", "disabled");
        }
        loginEl?.addEventListener("click", async () => {
          const webfinger = (webfingerEl) ? webfingerEl.value : null
          const actorId = await getActorIdFromWebfinger(webfinger)
          const origin = (new URL(actorId)).origin

          let as = await getStoredAs(origin);

          if (!as) {
            as = await discoverAs(origin, actorId)
            localStorage.setItem(`as:${origin}`, JSON.stringify(as))
          }

          let client = getStoredClient(origin);

          if (!client) {
            client = await discoverClient(as, origin)
            localStorage.setItem(`client:${origin}`, JSON.stringify(client))
          }

          sessionStorage.setItem('as_origin', origin)

          await startLogin(as, client);
        });
        logoutEl?.addEventListener("click", async () => {
          sessionStorage.clear();
          window.location.href = redirectUri;
        });
        refreshEl?.addEventListener("click", async () => {
          const as = getStoredAs(getStoredOrigin());
          const client = getStoredClient(getStoredOrigin());
          await refreshAccessToken(as, client);
        });
      });
    </script>
  </body>
</html>
